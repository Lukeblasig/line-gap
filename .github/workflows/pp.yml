name: Pull PrizePicks
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node pp-pull.mjs
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
